<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convivencia Escolar - I.E.P San Jerónimo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
        .navbar { background: #1e293b; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .brand-logo { width: 36px; height: 36px; background: #8b0000; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .nav-links { display: flex; gap: 8px; list-style: none; flex-wrap: wrap; align-items: center; }
        .nav-links a { color: #cbd5e1; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { background: #8b0000; color: white; }
        .container { max-width: 900px; margin: 30px auto; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h2 { color: #8b0000; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 13px; }
        th { background: #1e293b; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .ok { background: #dcfce7; color: #166534; }
        .warn { background: #fef9c3; color: #854d0e; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="brand-logo">SJ</div>
            <strong>I.E.P. SAN JERÓNIMO</strong>
        </div>
        <ul class="nav-links" id="nav-links"></ul>
    </nav>
    <div class="container">
        <h2>Registro de Convivencia y Disciplina</h2>
        <table>
            <thead>
                <tr><th>Fecha</th><th>Incidencia</th><th>Nivel</th><th>Estado</th></tr>
            </thead>
            <tbody>
                <tr><td>05/04/2026</td><td>Tardanza reiterada</td><td>Leve</td><td><span class="badge warn">EN SEGUIMIENTO</span></td></tr>
                <tr><td>12/02/2026</td><td>Sin incidencias registradas</td><td>-</td><td><span class="badge ok">CONFORME</span></td></tr>
            </tbody>
        </table>
    </div>

    <script src="auth.js"></script>
    <script>
        protegerPagina();
        pintarMenu();
    </script>
</body>
</html>
