<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Web de Gestión Académica</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 20px; border-radius: 8px; width: 300px; text-align: center; border: 1px solid #ccc; }
        h2 { color: #8b0000; }
        input, select, button { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { background: #8b0000; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Iniciar Sesión</h2>
        <select>
            <option>Administrador</option>
            <option>Docente</option>
            <option>Estudiante / Apoderado</option>
        </select>
        <input type="text" placeholder="Usuario / DNI">
        <input type="password" placeholder="Contraseña">
        <button onclick="alert('Bienvenido al Sistema')">Ingresar</button>
    </div>
</body>
</html>
