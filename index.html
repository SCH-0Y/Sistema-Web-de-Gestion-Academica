<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Web de Gestión Académica</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            width: 340px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 6px solid #8b0000;
        }
        h2 {
            color: #8b0000;
            margin-top: 0;
            font-size: 22px;
            font-weight: 700;
        }
        p {
            color: #475569;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        input, select, button {
            width: 100%;
            padding: 11px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #8b0000;
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.15);
        }
        button {
            background: #8b0000;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        button:hover {
            background: #6b0000;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Iniciar Sesión</h2>
        <p>Sistema Web de Gestión Académica</p>
        <select>
            <option>Administrador</option>
            <option>Docente</option>
            <option>Estudiante / Apoderado</option>
        </select>
        <input type="text" placeholder="Usuario / DNI">
        <input type="password" placeholder="Contraseña">
        <button onclick="alert('Bienvenido al Sistema')">Ingresar</button>
    </div>
</body>
</html>
