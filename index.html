<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Web de Gestión Académica</title>
    <style>
        body {font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #686de0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 {
            color: #1e293b;
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
        }
        p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 20px;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }
        button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>¡Bienvenido!</h2>
        <p>Sistema Web de Gestión Académica</p>
        <select>
            <option>Administrador</option>
            <option>Docente</option>
            <option>Estudiante / Apoderado</option>
        </select>
        <input type="text" placeholder="Usuario / DNI">
        <input type="password" placeholder="Contraseña">
        <button onclick="alert('Bienvenido al Sistema')">Ingresar</button>
    </div>
</body>
</html>
