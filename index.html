<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Web de Gestión Académica - Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; margin: 0; padding: 40px 20px; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; width: 100%; max-width: 400px; overflow: hidden; }
        .header { background: #8b0000; color: white; padding: 18px 20px; text-align: center; }
        .header h2 { margin: 0; font-size: 18px; text-transform: uppercase; letter-spacing: 0.5px; }
        .header p { margin: 5px 0 0 0; font-size: 12px; opacity: 0.9; }
        .container { padding: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #475569; }
        input, select, button { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        input:focus, select:focus { outline: none; border-color: #8b0000; }
        .btn-main { background: #8b0000; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-main:hover { background: #6b0000; }
        .footer-info { text-align: center; margin-top: 15px; font-size: 12px; color: #64748b; border-top: 1px solid #f1f5f9; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>SISTEMA ACADÉMICO</h2>
            <p>Nivel Secundaria (1° a 5° Año)</p>
        </div>
        <div class="container">
            <div class="form-group">
                <label>Rol de Usuario</label>
                <select>
                    <option>ADMIN (Administrador)</option>
                    <option>DOCENTE (Profesor)</option>
                    <option>APODERADO / ALUMNO</option>
                    <option>POSTULANTE</option>
                </select>
            </div>
            <div class="form-group">
                <label>Código de Alumno / DNI</label>
                <input type="text" placeholder="Ingrese su código de alumno o DNI">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" placeholder="••••••••">
            </div>
            <button class="btn-main" onclick="alert('Acceso Correcto al Sistema')">INGRESAR AL SISTEMA</button>
            
            <div class="footer-info">
                Plataforma de Control de Admisión, Matrícula y Notas
            </div>
        </div>
    </div>
</body>
</html>
