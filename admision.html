<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Admisión</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #686de0 100%);
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 420px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 { color: #0f172a; margin-top: 0; }
        input, select, button {
            width: 100%;
            padding: 11px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
        .info {
            background: #e0e7ff;
            color: #3730a3;
            padding: 10px;
            font-size: 13px;
            margin-bottom: 12px;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Registro de Admisión</h2>
        <div class="info">⚡ Vacantes en 3.º Sec: 8 / 25</div>
        <select>
            <option>Examen de Admisión</option>
            <option>Traslado Externo</option>
        </select>
        <input type="text" placeholder="DNI del Postulante">
        <input type="text" placeholder="Nombres y Apellidos">
        <input type="number" placeholder="Puntaje de Examen (0-20)">
        <button onclick="alert('Postulante Registrado')">Registrar Postulación</button>
    </div>
</body>
</html>
