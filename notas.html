<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Docente - I.E.P San Jerónimo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
        .navbar { background: #1e293b; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .brand-logo { width: 36px; height: 36px; background: #8b0000; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .nav-links { display: flex; gap: 8px; list-style: none; flex-wrap: wrap; align-items: center; }
        .nav-links a { color: #cbd5e1; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { background: #8b0000; color: white; }
        .container { max-width: 900px; margin: 30px auto; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h2 { color: #8b0000; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .filters { display: flex; gap: 15px; background: #f1f5f9; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #1e293b; color: white; }
        input[type="number"] { width: 60px; text-align: center; padding: 4px; border-radius: 4px; border: 1px solid #cbd5e1; }
        .btn-main { background: #8b0000; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-main:hover { background: #6b0000; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="brand-logo">SJ</div>
            <strong>I.E.P. SAN JERÓNIMO</strong>
        </div>
        <ul class="nav-links" id="nav-links"></ul>
    </nav>
    <div class="container">
        <h2>Registro de Calificaciones Académicas</h2>
        <div class="filters">
            <label>Sección: <strong>3° Sec - B</strong></label>
            <label>Curso: <strong>Matemática</strong></label>
            <label>Periodo: <strong>Bimestre I (2026)</strong></label>
        </div>
        <table>
            <thead>
                <tr><th>N°</th><th>Alumno</th><th>Cód. Mat.</th><th>Nota (0-20)</th><th>Estado</th><th>Fecha Reg.</th></tr>
            </thead>
            <tbody>
                <tr><td>01</td><td style="text-align:left;">Aguilar Rios, Pedro</td><td>SEC-20261</td><td><input type="number" value="16.5"></td><td>Aprobado</td><td>20/05/2026</td></tr>
                <tr><td>02</td><td style="text-align:left;">Castro Fernández, Lucia</td><td>SEC-20262</td><td><input type="number" value="09.0"></td><td>Desaprobado</td><td>20/05/2026</td></tr>
            </tbody>
        </table>
        <br>
        <button class="btn-main" onclick="alert('Notas guardadas')">Guardar Cambios</button>
    </div>

    <script src="auth.js"></script>
    <script>
        protegerPagina();
        pintarMenu();
    </script>
</body>
</html>
