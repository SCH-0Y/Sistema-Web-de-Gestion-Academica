<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Docente</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
        .header { background: #8b0000; color: white; padding: 12px 20px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; }
        .container { background: white; padding: 20px; border-radius: 0 0 8px 8px; border: 1px solid #e2e8f0; }
        .filters { display: flex; gap: 15px; background: #f1f5f9; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #1e293b; color: white; }
        input[type="number"] { width: 60px; text-align: center; padding: 4px; }
        .btn-main { background: #8b0000; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <strong>SISTEMA ACADÉMICO | Portal Docente</strong>
        <span>Docente: María López</span>
    </div>
    <div class="container">
        <div class="filters">
            <label>Sección: <strong>3° Sec - B</strong></label>
            <label>Curso: <strong>Matemática</strong></label>
            <label>Periodo: <strong>Bimestre I (2026)</strong></label>
        </div>
        <table>
            <thead>
                <tr><th>N°</th><th>Alumno</th><th>Cód. Mat.</th><th>Nota (0-20)</th><th>Estado</th><th>Fecha Reg.</th></tr>
            </thead>
            <tbody>
                <tr><td>01</td><td style="text-align:left;">Aguilar Rios, Pedro</td><td>SEC-20261</td><td><input type="number" value="16.5"></td><td>Aprobado</td><td>20/05/2026</td></tr>
                <tr><td>02</td><td style="text-align:left;">Castro Fernández, Lucia</td><td>SEC-20262</td><td><input type="number" value="09.0"></td><td>Desaprobado</td><td>20/05/2026</td></tr>
                <tr><td>03</td><td style="text-align:left;">Mendoza Silva, Carlos</td><td>SEC-20263</td><td><input type="number" value=""></td><td>Pendiente</td><td>--</td></tr>
            </tbody>
        </table>
        <br>
        <button class="btn-main">Guardar Cambios</button>
        <button class="btn-main" style="background:#1e293b;">Publicar Notas</button>
    </div>
</body>
</html>
