<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Calificaciones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #686de0 100%);
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 520px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 { color: #0f172a; margin-top: 0; }
        p { color: #475569; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #4f46e5; color: white; border-radius: 4px; }
        input[type="number"] { width: 50px; padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1; text-align: center; }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
        }
        .badge { background: #dcfce7; color: #166534; padding: 4px 8px; font-size: 12px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Registro de Notas - Bimestre I</h2>
        <p><strong>Curso:</strong> Matemáticas | <strong>Acta:</strong> <span class="badge">ABIERTA (RN-02)</span></p>
        <table>
            <thead>
                <tr>
                    <th>Alumno</th>
                    <th>Nota 1</th>
                    <th>Examen</th>
                    <th>Promed.</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="text-align: left;">Gómez, Carlos</td>
                    <td><input type="number" value="16"></td>
                    <td><input type="number" value="14"></td>
                    <td><strong>15.0</strong></td>
                </tr>
                <tr>
                    <td style="text-align: left;">Pérez, Juan</td>
                    <td><input type="number" value="18"></td>
                    <td><input type="number" value="17"></td>
                    <td><strong>17.5</strong></td>
                </tr>
            </tbody>
        </table>
        <button onclick="alert('Notas Guardadas')">Guardar Calificaciones</button>
    </div>
</body>
</html>
