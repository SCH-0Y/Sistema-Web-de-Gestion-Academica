<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta de Libreta de Notas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #686de0 100%);
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 520px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 { color: #0f172a; margin-top: 0; }
        .info-student { background: #f1f5f9; padding: 12px; border-radius: 8px; font-size: 13px; color: #334155; margin-bottom: 15px; line-height: 1.5; }
        .status-ok { color: #16a34a; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #1e293b; color: white; }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Libreta de Notas Digital</h2>
        <div class="info-student">
            <strong>Alumno:</strong> Pérez Gómez, Juan<br>
            <strong>Grado/Sección:</strong> 3.º de Secundaria "A"<br>
            <strong>Estado de Cuenta:</strong> <span class="status-ok">Solvente (RN-04)</span>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Curso</th>
                    <th>Bimestre I</th>
                    <th>% Asistencia</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Matemáticas</td>
                    <td>17.5</td>
                    <td>98%</td>
                </tr>
                <tr>
                    <td>Comunicación</td>
                    <td>16.0</td>
                    <td>100%</td>
                </tr>
            </tbody>
        </table>
        <button onclick="alert('Descargando Libreta en PDF...')">Descargar Libreta (PDF)</button>
    </div>
</body>
</html>
