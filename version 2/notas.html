<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal Docente - I.E.P San Jerónimo</title>
    <!-- Framework Bulma -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <!-- Tema San Jerónimo, animaciones, Flexbox, Grid y responsivo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar is-sj" role="navigation" aria-label="Menú principal">
        <div class="navbar-brand">
            <a class="navbar-item" href="index.html">
                <img class="brand-logo" src="logo.png" alt="Logo I.E.P. San Jerónimo">
                <strong class="brand-title">I.E.P. SAN JERÓNIMO</strong>
            </a>
            <button class="navbar-burger" type="button" aria-label="Abrir menú" aria-expanded="false" data-target="menu-principal">
                <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
            </button>
        </div>
        <div class="navbar-menu" id="menu-principal">
            <div class="navbar-end" id="nav-links"></div>
        </div>
    </nav>

    <main class="section">
        <div class="container is-max-desktop">
            <div class="box page-box">
                <h2 class="title is-4 page-title">Registro de Calificaciones Académicas</h2>
                <div class="info-grid">
                    <div><span>Sección</span><strong>3° Sec - B</strong></div>
                    <div><span>Curso</span><strong>Matemática</strong></div>
                    <div><span>Periodo</span><strong>Bimestre I (2026)</strong></div>
                </div>
                <div class="table-container">
                    <table class="table is-fullwidth is-striped is-hoverable">
                        <thead>
                            <tr><th class="has-text-centered">N°</th><th>Alumno</th><th class="has-text-centered">Cód. Mat.</th><th class="has-text-centered">Nota (0-20)</th><th class="has-text-centered">Estado</th><th class="has-text-centered">Fecha Reg.</th></tr>
                        </thead>
                        <tbody id="tabla-alumnos">
                            <tr>
                                <td class="has-text-centered">01</td>
                                <td>Aguilar Rios, Pedro</td>
                                <td class="has-text-centered">SEC-20261</td>
                                <td class="has-text-centered"><input type="text" value="13.5" class="input is-small input-nota" maxlength="4" inputmode="decimal" aria-label="Nota de Aguilar Rios, Pedro"></td>
                                <td class="has-text-centered"><span class="tag estado-nota">Aprobado</span></td>
                                <td class="has-text-centered">20/05/2026</td>
                            </tr>
                            <tr>
                                <td class="has-text-centered">02</td>
                                <td>Castro Fernández, Lucia</td>
                                <td class="has-text-centered">SEC-20262</td>
                                <td class="has-text-centered"><input type="text" value="10.4" class="input is-small input-nota" maxlength="4" inputmode="decimal" aria-label="Nota de Castro Fernández, Lucia"></td>
                                <td class="has-text-centered"><span class="tag estado-nota">Desaprobado</span></td>
                                <td class="has-text-centered">20/05/2026</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <button class="button is-link is-rounded" id="btn-guardar-notas" type="button">Guardar Cambios</button>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        protegerPagina();
        pintarMenu();

        document.addEventListener('DOMContentLoaded', function () {

            // 1. Control estricto MIENTRAS escribe (bloquea el 21 en tiempo real)
            document.addEventListener('input', function (e) {
                if (e.target.classList.contains('input-nota')) {
                    let input = e.target;

                    // Solo permitir números y punto
                    input.value = input.value.replace(/[^0-9.]/g, '');

                    // Evitar múltiples puntos
                    let partes = input.value.split('.');
                    if (partes.length > 2) {
                        input.value = partes[0] + '.' + partes.slice(1).join('');
                    }

                    // Limitar estrictamente a 20 al instante
                    if (input.value !== '') {
                        let num = parseFloat(input.value);
                        if (num > 20) {
                            input.value = '20';
                        }
                    }
                }
            });

            // 2. Redondeo automático al SALIR de la casilla
            document.addEventListener('blur', function (e) {
                if (e.target.classList.contains('input-nota')) {
                    aplicarRedondeo(e.target);
                }
            }, true);

            // 3. Redondeo automático al presionar ENTER y saltar a la siguiente nota
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && e.target.classList.contains('input-nota')) {
                    e.preventDefault();
                    let input = e.target;

                    aplicarRedondeo(input);

                    let todosLosInputs = Array.from(document.querySelectorAll('.input-nota'));
                    let indexActual = todosLosInputs.indexOf(input);
                    if (indexActual > -1 && indexActual + 1 < todosLosInputs.length) {
                        todosLosInputs[indexActual + 1].focus();
                    } else {
                        input.blur();
                    }
                }
            });

            // Redondeo escolar peruano
            function aplicarRedondeo(inputElement) {
                let val = inputElement.value.trim();
                if (val === '') return;

                let num = parseFloat(val);
                if (isNaN(num)) {
                    inputElement.value = '';
                    return;
                }

                if (num < 0) num = 0;
                if (num > 20) num = 20;

                // Redondea 10.5 a 11, pero 10.4 se queda en 10
                inputElement.value = Math.round(num);
            }
        });

        // Estado Aprobado / Desaprobado con etiquetas de Bulma
        document.querySelectorAll('.input-nota').forEach(function (input) {
            function actualizarEstado() {
                const numero = parseFloat(input.value);
                const estado = input.closest('tr').querySelector('.estado-nota');
                if (!estado || Number.isNaN(numero)) return;
                const aprobado = numero >= 11;
                estado.textContent = aprobado ? 'Aprobado' : 'Desaprobado';
                estado.classList.remove('is-success', 'is-danger', 'is-light');
                estado.classList.add(aprobado ? 'is-success' : 'is-danger', 'is-light');
            }
            input.addEventListener('input', actualizarEstado);
            input.addEventListener('blur', actualizarEstado);
            actualizarEstado();
        });

        document.getElementById('btn-guardar-notas').addEventListener('click', function () {
            const notas = Array.from(document.querySelectorAll('.input-nota')).map(i => i.value);
            localStorage.setItem('notasDemo', JSON.stringify(notas));
            this.textContent = '✓ Cambios guardados';
            setTimeout(() => this.textContent = 'Guardar Cambios', 1800);
        });
    </script>
</body>
</html>
