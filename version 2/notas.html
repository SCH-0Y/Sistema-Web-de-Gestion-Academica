<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Docente - I.E.P San Jerónimo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; color: #0f2a4a; min-height: 100vh; }
        .navbar { background: #0f2a4a; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .brand-logo { width: 36px; height: 36px; background: #1d4ed8; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .nav-links { display: flex; gap: 8px; list-style: none; flex-wrap: wrap; align-items: center; }
        .nav-links a { color: #cbd5e1; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { background: #1d4ed8; color: white; }
        .container { max-width: 900px; margin: 30px auto; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h2 { color: #1d4ed8; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        .filters { display: flex; gap: 15px; background: #f1f5f9; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #0f2a4a; color: white; }

        /* Estilo para las casillas de notas (tipo texto, sin flechitas) */
        .input-nota { width: 75px; text-align: center; padding: 6px; border-radius: 4px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; }
        .input-nota:focus { border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,0.15); }

        .btn-main { background: #1d4ed8; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-main:hover { background: #1e40af; }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false"><span>☰</span></button>
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="brand-logo">SJ</div>
            <strong>I.E.P. SAN JERÓNIMO</strong>
        </div>
        <ul class="nav-links" id="nav-links"></ul>
    </nav>
    <div class="container">
        <h2>Registro de Calificaciones Académicas</h2>
        <div class="filters">
            <label>Sección: <strong>3° Sec - B</strong></label>
            <label>Curso: <strong>Matemática</strong></label>
            <label>Periodo: <strong>Bimestre I (2026)</strong></label>
        </div>
        <div class="table-responsive"><table>
            <thead>
                <tr><th>N°</th><th>Alumno</th><th>Cód. Mat.</th><th>Nota (0-20)</th><th>Estado</th><th>Fecha Reg.</th></tr>
            </thead>
            <tbody id="tabla-alumnos">
                <tr>
                    <td>01</td>
                    <td style="text-align:left;">Aguilar Rios, Pedro</td>
                    <td>SEC-20261</td>
                    <td><input type="text" value="13.5" class="input-nota" maxlength="4"></td>
                    <td class="estado-nota">Aprobado</td>
                    <td>20/05/2026</td>
                </tr>
                <tr>
                    <td>02</td>
                    <td style="text-align:left;">Castro Fernández, Lucia</td>
                    <td>SEC-20262</td>
                    <td><input type="text" value="10.4" class="input-nota" maxlength="4"></td>
                    <td class="estado-nota">Desaprobado</td>
                    <td>20/05/2026</td>
                </tr>
            </tbody>
        </table></div>
        <br>
        <button class="btn-main" onclick="alert('Notas guardadas correctamente')">Guardar Cambios</button>
    </div>

    <script src="auth.js"></script>
    <script>
        protegerPagina();
        pintarMenu();

        document.addEventListener("DOMContentLoaded", function() {

            // 1. Control estricto MIENTRAS escribe (bloquea el 21 en tiempo real)
            document.addEventListener('input', function(e) {
                if (e.target.classList.contains('input-nota')) {
                    let input = e.target;
                    
                    // Solo permitir números y punto
                    input.value = input.value.replace(/[^0-9.]/g, '');
                    
                    // Evitar múltiples puntos
                    let partes = input.value.split('.');
                    if (partes.length > 2) {
                        input.value = partes[0] + '.' + partes.slice(1).join('');
                    }

                    // Limitar estrictamente a 20 al instante
                    if (input.value !== "") {
                        let num = parseFloat(input.value);
                        if (num > 20) {
                            input.value = "20"; // Si pone 21, 25, 100... baja a 20 al instante
                        }
                    }
                }
            });

            // 2. Redondeo automático al SALIR de la casilla con el mouse
            document.addEventListener('blur', function(e) {
                if (e.target.classList.contains('input-nota')) {
                    aplicarRedondeo(e.target);
                }
            }, true);

            // 3. Redondeo automático al presionar ENTER y saltar a la siguiente nota
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && e.target.classList.contains('input-nota')) {
                    e.preventDefault();
                    let input = e.target;
                    
                    aplicarRedondeo(input);
                    
                    // Pasar a la siguiente casilla de abajo automáticamente
                    let todosLosInputs = Array.from(document.querySelectorAll('.input-nota'));
                    let indexActual = todosLosInputs.indexOf(input);
                    if (indexActual > -1 && indexActual + 1 < todosLosInputs.length) {
                        todosLosInputs[indexActual + 1].focus();
                    } else {
                        input.blur();
                    }
                }
            });

            // Función centralizada para el redondeo escolar peruano
            function aplicarRedondeo(inputElement) {
                let val = inputElement.value.trim();
                if (val === "") return;
                
                let num = parseFloat(val);
                if (isNaN(num)) {
                    inputElement.value = "";
                    return;
                }
                
                if (num < 0) num = 0;
                if (num > 20) num = 20;

                // Redondea 10.5 a 11, pero 10.4 se queda en 10
                inputElement.value = Math.round(num);
            }

        });
    
    document.querySelectorAll('.input-nota').forEach(function (input) {
        function actualizarEstado() {
            const numero = parseFloat(input.value);
            const estado = input.closest('tr').querySelector('.estado-nota');
            if (!estado || Number.isNaN(numero)) return;
            estado.textContent = numero >= 11 ? 'Aprobado' : 'Desaprobado';
            estado.style.color = numero >= 11 ? '#166534' : '#991b1b';
            estado.style.fontWeight = '700';
        }
        input.addEventListener('input', actualizarEstado);
        input.addEventListener('blur', actualizarEstado);
        actualizarEstado();
    });

    document.getElementById('btn-guardar-notas').addEventListener('click', function () {
        const notas = Array.from(document.querySelectorAll('.input-nota')).map(i => i.value);
        localStorage.setItem('notasDemo', JSON.stringify(notas));
        this.textContent = '✓ Cambios guardados';
        setTimeout(() => this.textContent = 'Guardar Cambios', 1800);
    });
</script>
</body>
</html>
