<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matrícula Escolar - I.E.P San Jerónimo</title>
    <!-- Framework Bulma -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <!-- Tema San Jerónimo, animaciones, Flexbox, Grid y responsivo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar is-sj" role="navigation" aria-label="Menú principal">
        <div class="navbar-brand">
            <a class="navbar-item" href="index.html">
                <img class="brand-logo" src="logo.png" alt="Logo I.E.P. San Jerónimo">
                <strong class="brand-title">I.E.P. SAN JERÓNIMO</strong>
            </a>
            <button class="navbar-burger" type="button" aria-label="Abrir menú" aria-expanded="false" data-target="menu-principal">
                <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
            </button>
        </div>
        <div class="navbar-menu" id="menu-principal">
            <div class="navbar-end" id="nav-links"></div>
        </div>
    </nav>

    <main class="section">
        <div class="container is-max-tablet">
            <div class="box page-box">
                <h2 class="title is-4 page-title">Ficha de Matrícula Escolar 2026</h2>
                <div class="field">
                    <label class="label" for="persona">Buscar Persona (Alumno / Postulante Aprobado)</label>
                    <div class="control">
                        <input class="input" type="text" id="persona" value="Carlos Mendoza (ID: 504) - Rol: POSTULANTE" aria-label="Alumno o postulante">
                    </div>
                </div>
                <div class="columns">
                    <div class="column is-half">
                        <div class="field">
                            <label class="label" for="grado">Año Académico y Grado</label>
                            <div class="control is-expanded"><div class="select is-fullwidth"><select id="grado"><option>2026 - 1° de Secundaria</option></select></div></div>
                        </div>
                    </div>
                    <div class="column is-half">
                        <div class="field">
                            <label class="label" for="seccion">Sección Asignada</label>
                            <div class="control is-expanded"><div class="select is-fullwidth"><select id="seccion"><option value="2">Sección "A" (Disponibles: 2)</option></select></div></div>
                        </div>
                    </div>
                </div>
                <div class="notification is-success is-light anim-in">
                    ✓ DISPONIBILIDAD DE VACANTES: Totales: 25 | Disponibles: 2 | Estado: DISPONIBLE (RN-03: aforo máximo 25 alumnos por sección)
                </div>
                <button class="button is-link is-rounded is-fullwidth" id="btn-matricular" type="button">REGISTRAR MATRÍCULA</button>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        protegerPagina();
        pintarMenu();

        document.getElementById('btn-matricular').addEventListener('click', function () {
            const persona = document.getElementById('persona').value.trim();
            const seccion = document.getElementById('seccion');
            if (!persona) {
                alert('Ingrese o seleccione un alumno antes de registrar la matrícula.');
                return;
            }
            const disponibles = Number(seccion.value);
            if (disponibles <= 0) {
                alert('No hay vacantes disponibles en la sección seleccionada.');
                return;
            }
            const confirmar = confirm('¿Registrar matrícula para ' + persona + '?');
            if (!confirmar) return;

            localStorage.setItem('matriculaDemo', JSON.stringify({
                persona: persona,
                seccion: seccion.options[seccion.selectedIndex].text,
                fecha: new Date().toISOString()
            }));
            this.textContent = '✓ Matrícula registrada';
            this.classList.add('is-success');
            this.disabled = true;
        });
    </script>
</body>
</html>
