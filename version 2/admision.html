<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Admisión - I.E.P San Jerónimo</title>
    <!-- Framework Bulma -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <!-- Tema San Jerónimo, animaciones, Flexbox, Grid y responsivo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar is-sj" role="navigation" aria-label="Menú principal">
        <div class="navbar-brand">
            <a class="navbar-item" href="index.html">
                <img class="brand-logo" src="logo.png" alt="Logo I.E.P. San Jerónimo">
                <strong class="brand-title">I.E.P. SAN JERÓNIMO</strong>
            </a>
            <button class="navbar-burger" type="button" aria-label="Abrir menú" aria-expanded="false" data-target="menu-principal">
                <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
            </button>
        </div>
        <div class="navbar-menu" id="menu-principal">
            <div class="navbar-end" id="nav-links"></div>
        </div>
    </nav>

    <main class="section">
        <div class="container is-max-desktop">
            <div class="box page-box">
                <h2 class="title is-4 page-title">Panel de Admisión y Postulantes</h2>
                <div class="filters">
                    <div class="control"><div class="select"><select id="filtro-anio" aria-label="Filtrar por año"><option value="todos">Año 2026</option></select></div></div>
                    <div class="control"><div class="select"><select id="filtro-estado" aria-label="Filtrar por estado"><option value="todos">Estado (Todos)</option><option value="PENDIENTE">Pendiente</option><option value="EN_EVALUACION">En evaluación</option><option value="APROBADO">Aprobado</option></select></div></div>
                    <div class="control"><div class="select"><select id="filtro-grado" aria-label="Filtrar por grado"><option value="todos">Grado (1° a 5° Sec)</option><option value="1° Sec.">1° Sec.</option><option value="3° Sec.">3° Sec.</option><option value="5° Sec.">5° Sec.</option></select></div></div>
                    <div class="control"><button class="button is-link is-rounded" id="btn-nueva-solicitud" type="button">+ Nueva Solicitud</button></div>
                </div>
                <div class="table-container">
                    <table class="table is-fullwidth is-striped is-hoverable">
                        <thead>
                            <tr><th>ID</th><th>Postulante</th><th>Grado</th><th>Tipo</th><th>Fecha</th><th>Estado</th><th>Acción</th></tr>
                        </thead>
                        <tbody id="tabla-postulantes">
                            <tr><td>101</td><td>Carlos Mendoza</td><td>1° Sec.</td><td>NUEVO</td><td>10/01/2026</td><td><span class="tag is-warning is-light">PENDIENTE</span></td><td><button type="button" class="button is-small is-link is-outlined is-rounded btn-accion" data-accion="Evaluar">Evaluar</button></td></tr>
                            <tr><td>102</td><td>Ana Gómez</td><td>3° Sec.</td><td>TRASLADO</td><td>11/01/2026</td><td><span class="tag is-warning is-light">EN_EVALUACION</span></td><td><button type="button" class="button is-small is-link is-outlined is-rounded btn-accion" data-accion="Ver Ficha">Ver Ficha</button></td></tr>
                            <tr><td>103</td><td>Luis Paredes</td><td>5° Sec.</td><td>NUEVO</td><td>12/01/2026</td><td><span class="tag is-success is-light">APROBADO</span></td><td><button type="button" class="button is-small is-link is-rounded" onclick="location.href='matricula.html'">Matricular</button></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        protegerPagina();
        pintarMenu();

        const filas = Array.from(document.querySelectorAll('#tabla-postulantes tr'));

        function aplicarFiltros() {
            const estado = document.getElementById('filtro-estado').value;
            const grado = document.getElementById('filtro-grado').value;
            filas.forEach(function (fila) {
                const textoEstado = fila.children[5]?.innerText.trim();
                const textoGrado = fila.children[2]?.innerText.trim();
                const visibleEstado = estado === 'todos' || textoEstado === estado;
                const visibleGrado = grado === 'todos' || textoGrado === grado;
                fila.style.display = visibleEstado && visibleGrado ? '' : 'none';
            });
        }

        document.querySelectorAll('#filtro-estado, #filtro-grado').forEach(function (el) {
            el.addEventListener('change', aplicarFiltros);
        });

        document.querySelectorAll('.btn-accion').forEach(function (btn) {
            btn.addEventListener('click', function () {
                alert(btn.dataset.accion + ': ficha del postulante disponible para revisión.');
            });
        });

        document.getElementById('btn-nueva-solicitud').addEventListener('click', function () {
            const nombre = prompt('Nombre completo del nuevo postulante:');
            if (!nombre || !nombre.trim()) return;
            const fila = document.createElement('tr');
            const celdaNombre = document.createElement('td');
            celdaNombre.textContent = nombre.trim();
            fila.innerHTML =
                '<td>NEW</td><td></td><td>1° Sec.</td>' +
                '<td>NUEVO</td><td>' + new Date().toLocaleDateString('es-PE') + '</td>' +
                '<td><span class="tag is-warning is-light">PENDIENTE</span></td>' +
                '<td><button type="button" class="button is-small is-link is-outlined is-rounded btn-accion">Evaluar</button></td>';
            fila.children[1].replaceWith(celdaNombre);
            document.getElementById('tabla-postulantes').appendChild(fila);
            filas.push(fila);
            fila.querySelector('.btn-accion').addEventListener('click', function () {
                alert('Ficha de ' + nombre.trim() + ' lista para evaluación.');
            });
        });
    </script>
</body>
</html>
