<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Matrícula</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            padding: 40px 20px;
            margin: 0;
            box-sizing: border-box;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 450px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            border-top: 5px solid #8b0000;
        }
        h2 { color: #8b0000; margin-top: 0; font-size: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }
        button {
            background: #8b0000;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
        button:hover { background: #6b0000; }
        .alert {
            background: #f0fdf4;
            color: #166534;
            padding: 10px;
            font-size: 13px;
            margin-bottom: 12px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Formulario de Matrícula Escolar 2026</h2>
        <div class="alert">✓ Validado: Apoderado Sin Deudas Pendientes (RN-01)</div>
        <input type="text" placeholder="DNI del Alumno / Postulante Aprobado">
        <select>
            <option>3.º de Secundaria - Sección "A"</option>
            <option>3.º de Secundaria - Sección "B"</option>
        </select>
        <div style="font-size: 13px; margin: 8px 0; color: #475569; font-weight: 500;">Aforo Sección A: 22 / 25 Ocupados (RN-03)</div>
        <button onclick="alert('Matrícula Confirmada')">Confirmar y Emitir Matrícula</button>
    </div>
</body>
</html>
