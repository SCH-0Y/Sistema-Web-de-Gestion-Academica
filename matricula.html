<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Matrícula</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
        .header { background: #8b0000; color: white; padding: 12px 20px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; }
        .container { background: white; padding: 25px; border-radius: 0 0 8px 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; max-width: 700px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input, select, button { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .vacantes-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 12px; border-radius: 6px; font-size: 13px; margin: 15px 0; }
        .btn-main { background: #8b0000; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <strong>Registro de Matrícula - Secundaria</strong>
            <span>Admin: Juan Pérez</span>
        </div>
        <br>
        <div class="form-group">
            <label>Buscar Persona (Alumno / Postulante Aprobado)</label>
            <input type="text" value="Carlos Mendoza (ID: 504) - Rol: POSTULANTE">
        </div>
        <p style="font-size: 13px; color: #64748b;"><strong>Solicitud Vinculada:</strong> Solicitud #101 (Grado: 1° Sec. - Estado: APROBADO)</p>
        
        <div class="form-group">
            <label>Año Académico y Grado</label>
            <select><option>2026 - 1° de Secundaria</option></select>
        </div>
        <div class="form-group">
            <label>Sección Asignada</label>
            <select><option>Sección "A" (Vacantes: 28/30)</option></select>
        </div>

        <div class="vacantes-box">
            <strong>DISPONIBILIDAD DE VACANTES:</strong> Totales: 30 | Disponibles: 2 | Estado: DISPONIBLE
        </div>

        <button class="btn-main">REGISTRAR MATRÍCULA</button>
    </div>
</body>
</html>
